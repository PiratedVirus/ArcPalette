<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    /* A soft wallpaper so the glass palette has colour to refract. */
    body {
      background:
        radial-gradient(60% 50% at 15% 20%, #9ec5ff 0%, transparent 60%),
        radial-gradient(55% 45% at 85% 15%, #f7b6d8 0%, transparent 60%),
        radial-gradient(60% 55% at 70% 85%, #b8f0d8 0%, transparent 60%),
        radial-gradient(50% 50% at 20% 85%, #ffe0a8 0%, transparent 60%),
        #eef0f6;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(60% 50% at 15% 20%, #1e3a8a 0%, transparent 60%),
          radial-gradient(55% 45% at 85% 15%, #6b2152 0%, transparent 60%),
          radial-gradient(60% 55% at 70% 85%, #0f5c4a 0%, transparent 60%),
          radial-gradient(50% 50% at 20% 85%, #6b4a12 0%, transparent 60%),
          #111216;
      }
    }
  </style>
</head>
<body>
  <script src="palette.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
